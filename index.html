<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Color de la barra del navegador antes de que monte React: --surface-page
         de cada modo (la primera pantalla es la bienvenida o el login). Después
         lo maneja useThemeColor, que lo lee del CSS. Si cambia --surface-page,
         cambia aquí también: un <meta> no puede leer una variable CSS. -->
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1627" media="(prefers-color-scheme: dark)" />
    <script>
      // Aplica el tema elegido a mano antes del primer pintado. Sin esto se
      // pintaba el del sistema hasta que montaba React (un parpadeo), y la
      // bienvenida y el onboarding nunca lo aplicaban.
      ;(function () {
        try {
          var theme = localStorage.getItem('theme')
          if (theme !== 'light' && theme !== 'dark') return
          document.documentElement.dataset.theme = theme
          var color = theme === 'dark' ? '#0E1627' : '#F8FAFC'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = color
          })
        } catch (e) {}
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Twoney" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Twoney</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
